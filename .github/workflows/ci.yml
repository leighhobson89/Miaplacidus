name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate localization catalogues
        run: npm run check:localization

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check module boundaries
        run: npm run check:boundaries

      - name: Build full browser game
        run: npm run build
